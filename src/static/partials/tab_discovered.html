<!-- TAB 1: Discovered Posts (Paginated Table) -->
    <div class="tab-panel hidden" id="tabDiscovered">
      <!-- Structured 2-Tier Filter & Search Toolbar -->
      <div class="toolbar-tiered">
        <!-- Row 1: Primary Search & Experience Pills -->
        <div class="toolbar-row primary-row">
          <div class="filter-pills" id="expPills">
            <button class="pill active" data-exp="ALL" onclick="setExpFilter('ALL')">All</button>
            <button class="pill" data-exp="FRESHER" onclick="setExpFilter('FRESHER')">Fresher (0-1 yr)</button>
            <button class="pill" data-exp="MID" onclick="setExpFilter('MID')">1 - 3 yrs</button>
            <button class="pill" data-exp="SENIOR" onclick="setExpFilter('SENIOR')">3 - 5+ yrs</button>
          </div>

          <div class="row-actions">
            <div class="search-box">
              <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="inputSearch" placeholder="Search author, keyword..." onkeyup="handleSearchKeyUp(event)" />
            </div>

            <button class="btn btn-add-jd" onclick="openAddJdModal()" title="Add Job Description Manually">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span>Add JD</span>
            </button>

            <button class="btn btn-outline btn-direct-outreach" onclick="openDirectOutreachModal()" title="Direct Opportunity Outreach">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <span>Direct Outreach</span>
            </button>

            <!-- Batch Action Trigger -->
            <button class="btn btn-primary btn-sm hidden" id="btnBatchGenerate" onclick="generateBatchChatGPT()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8.01" y2="16"></line><line x1="16" y1="16" x2="16.01" y2="16"></line></svg>
              <span>Generate (<span id="batchCountBadge">0</span>)</span>
            </button>
            <button class="btn btn-cancel-app btn-sm hidden" id="btnBatchDismiss" onclick="cancelBatchSelectedDiscovered()" title="Dismiss / remove selected posts from Discovered Jobs">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              <span>Dismiss (<span id="batchDismissCountBadge">0</span>)</span>
            </button>
          </div>
        </div>

        <!-- Row 2: Secondary Dropdown Filters (Source, Status, Category, Location) -->
        <div class="toolbar-row secondary-row">
          <div class="filters-group">
            <span class="filters-label">Filters:</span>
            <select id="selectSource" class="select-clean" onchange="applyFilters()" title="Filter by Job Source">
              <option value="ALL" selected>All Sources</option>
              <option value="INFOPARK">Infopark Kochi</option>
              <option value="LINKEDIN">LinkedIn</option>
              <option value="MANUAL">Manual JDs</option>
              <option value="DIRECT">Direct Outreach</option>
            </select>

            <select id="selectGenStatus" class="select-clean" onchange="applyFilters()" title="Filter by generation status">
              <option value="PENDING" selected>Yet to Generate (Default)</option>
              <option value="ALL">All Status (Pending First)</option>
              <option value="GENERATED">Already Generated</option>
              <option value="SENT">Sent Applications</option>
              <option value="REJECTED">Cancelled / Screened</option>
            </select>

            <select id="selectCategory" class="select-clean" onchange="applyFilters()">
              <option value="EMAIL_OUTREACH">Direct Email Outreach</option>
              <option value="DRAFT_PORTAL">Drafts & Portals</option>
              <option value="ALL">All Categories</option>
            </select>

            <select id="selectLocationFilter" class="select-clean" onchange="applyFilters()" title="Filter by Job Location">
              <option value="ALL" selected>All Locations</option>
            </select>
          </div>
        </div>

        <!-- Row 3: Reason Dropdown, Separator, Dates, From-To, Sort, Results Badge & Clear Filters -->
        <div class="toolbar-row secondary-row row-tertiary">
          <div class="filters-group">
            <span class="filters-label">Reason:</span>
            <select id="selectReasonFilterDiscovered" class="select-clean select-reason-discovered" onchange="applyFilters()" title="Filter by cancellation / rejection reason">
              <option value="ALL" selected>All Reasons</option>
            </select>

            <!-- Vertical Separator -->
            <span class="toolbar-separator" aria-hidden="true"></span>

            <select id="selectDateFilter" class="select-clean" onchange="handleDateFilterSelectChange()" title="Filter by Crawled Date">
              <option value="ALL" selected>All Dates</option>
              <option value="24H">Last 24 Hours</option>
              <option value="TODAY">Today</option>
              <option value="YESTERDAY">Yesterday</option>
              <option value="2D">Last 2 Days</option>
              <option value="3D">Last 3 Days</option>
              <option value="WEEK">Past 7 Days</option>
              <option value="CUSTOM">Custom...</option>
            </select>

            <div class="custom-date-filter-group hidden" id="customDateFilterGroup">
              <input type="number" id="customDateFilterValue" min="1" max="365" value="12" class="select-clean input-custom-date" title="Enter hours or days" oninput="applyFilters()" />
              <select id="customDateFilterUnit" class="select-clean select-custom-unit" title="Unit" onchange="applyFilters()">
                <option value="hours" selected>hrs</option>
                <option value="days">days</option>
              </select>
            </div>

            <div class="date-filter-group" title="Filter discovered jobs by date range">
              <span class="date-label">From</span>
              <input type="date" id="discoveredDateFrom" class="input-date-clean" onchange="applyDiscoveredDateFilter()" title="Start date" />
              <span class="date-label">To</span>
              <input type="date" id="discoveredDateTo" class="input-date-clean" onchange="applyDiscoveredDateFilter()" title="End date" />
            </div>

            <select id="selectSortBy" class="select-clean" onchange="handleSortSelectChange(this.value)" title="Sort posts">
              <option value="default" selected>Sort: Default</option>
              <option value="exp_asc">Exp: Low to High</option>
              <option value="exp_desc">Exp: High to Low</option>
              <option value="date_desc">Date: Newest First</option>
              <option value="date_asc">Date: Oldest First</option>
              <option value="author_asc">Author: A → Z</option>
              <option value="author_desc">Author: Z → A</option>
            </select>

            <span class="filter-count-badge hidden" id="discoveredResultsBadge"></span>
          </div>

          <button class="btn-clear-filters hidden" id="btnClearDiscoveredFilters" onclick="clearDiscoveredFilters()" title="Reset all filters and search back to defaults">
            <span>✕ Clear Filters</span>
          </button>
        </div>

        <!-- Row 4: Active Filter Chips Bar (Displays on bottom with 'x' close buttons) -->
        <div class="active-filters-bar hidden" id="discoveredActiveFiltersBar">
          <span class="active-filters-label">Active:</span>
          <div class="active-filters-list" id="discoveredActiveFiltersList"></div>
          <button type="button" class="btn-clear-chips" onclick="clearDiscoveredFilters()" title="Clear all active filters">Clear all</button>
        </div>
      </div>

      <!-- Main Workspace Layout: Scrollable Table + Docked Right-Side Window -->
      <div class="discovered-workspace-wrapper" id="discoveredWorkspaceWrapper">
        <!-- Left Area: Posts Table Container -->
        <div class="discovered-table-container" id="discoveredTableContainer">
          <div class="table-card">
            <!-- Top Table Header Bar / Pagination Controls -->
            <div class="table-header-bar" id="discoveredTableHeaderBar">
              <div class="pagination-info" id="paginationInfoTop">
                Showing 0–0 of 0 posts
              </div>
              <div class="pagination-controls">
                <div class="rows-per-page">
                  <span>Rows:</span>
                  <select id="selectLimitTop" onchange="changeRowsPerPage(this.value)">
                    <option value="10">10</option>
                    <option value="25" selected>25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                  </select>
                </div>
                <div class="page-buttons" id="pageButtonsTop">
                  <!-- Dynamic page buttons -->
                </div>
              </div>
            </div>

            <div class="table-scroll-container" id="discoveredTableScrollContainer">
              <table class="reach-table discovered-table">
                <thead>
                  <tr>
                    <th width="35">
                      <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)" />
                    </th>
                    <th class="sortable-th" onclick="toggleSort('author')" title="Click to sort by Recruiter / Author">
                      <div class="th-sort-wrapper">
                        <span>Recruiter / Author</span>
                        <span class="sort-indicator" id="sortAuthorIndicator">↕</span>
                      </div>
                    </th>
                    <th width="135" class="sortable-th" onclick="toggleSort('exp')" title="Click to sort by Experience">
                      <div class="th-sort-wrapper">
                        <span>Experience</span>
                        <span class="sort-indicator" id="sortExpIndicator">↕</span>
                      </div>
                    </th>
                    <th width="220" class="sortable-th" onclick="toggleSort('date')" title="Click to sort by Date">
                      <div class="th-sort-wrapper">
                        <span>Date</span>
                        <span class="sort-indicator" id="sortDateIndicator">↕</span>
                      </div>
                    </th>
                    <th width="180">Contact Email</th>
                    <th width="160">Contact Number</th>
                    <th width="180" style="text-align: right;">Action</th>
                  </tr>
                </thead>
                <tbody id="postsTableBody">
                  <!-- Populated dynamically or with skeleton -->
                </tbody>
              </table>
            </div>

            <!-- Table Footer / Pagination Controls -->
            <div class="table-footer">
              <div class="pagination-info" id="paginationInfo">
                Showing 0–0 of 0 posts
              </div>

              <div class="pagination-controls">
                <div class="rows-per-page">
                  <span>Rows:</span>
                  <select id="selectLimit" onchange="changeRowsPerPage(this.value)">
                    <option value="10">10</option>
                    <option value="25" selected>25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                  </select>
                </div>

                <div class="page-buttons" id="pageButtons">
                  <!-- Rendered dynamically -->
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Area: Minimal Docked Side Window -->
        <aside class="discovered-detail-drawer hidden" id="discoveredDetailDrawer">
          <!-- Top Bar: Recruiter Title & Close Button -->
          <div class="drawer-top-bar">
            <div class="drawer-top-left">
              <span class="drawer-recruiter-title" id="discoveredDrawerAuthor">Recruiter Name</span>
              <span id="discoveredDrawerSourceBadge"></span>
            </div>
            <div class="drawer-top-right">
              <button type="button" class="btn-drawer-close" onclick="closeDiscoveredDetailDrawer()" title="Close details window (Esc)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
          </div>

          <!-- Contact Bar: Email & Contact Phone -->
          <div class="drawer-contact-bar">
            <div class="drawer-contact-item">
              <span class="drawer-contact-label">Email:</span>
              <span class="drawer-contact-val" id="discoveredDrawerEmail">—</span>
              <button type="button" class="btn-copy-micro hidden" id="btnCopyDiscoveredEmail" onclick="copyDiscoveredDrawerEmail()" title="Copy Email">Copy</button>
            </div>
            <div class="drawer-contact-item">
              <span class="drawer-contact-label">Contact:</span>
              <span class="drawer-contact-val" id="discoveredDrawerPhone">—</span>
              <button type="button" class="btn-copy-micro hidden" id="btnCopyDiscoveredPhone" onclick="copyDiscoveredDrawerPhone()" title="Copy Contact">Copy</button>
            </div>
          </div>

          <!-- Job Description Header & Body -->
          <div class="drawer-jd-header">
            <span>Job Description</span>
            <button type="button" class="btn-copy-micro" onclick="copyDiscoveredDrawerJd()" title="Copy entire Job Description">Copy JD</button>
          </div>
          <div class="drawer-jd-content" id="discoveredDrawerJd">
            <!-- Job Description Text -->
          </div>

          <!-- Bottom Action Bar: Generate Mail, Review, and Source Link -->
          <div class="drawer-bottom-bar">
            <div class="drawer-bottom-left">
              <a id="discoveredDrawerSourceLink" href="#" target="_blank" class="btn btn-outline btn-xs" title="Open source job link">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                <span>Source</span>
              </a>
              <button type="button" class="btn btn-cancel-app btn-xs" id="btnDrawerDismissDiscovered" onclick="drawerDismissDiscovered()" title="Dismiss this post">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                <span>Dismiss</span>
              </button>
            </div>
            <div class="drawer-bottom-right">
              <button type="button" class="btn btn-primary btn-sm" id="btnDrawerGenerateMail" onclick="drawerGenerateMailDiscovered()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                <span id="drawerGenBtnText">Generate Mail</span>
              </button>
              <button type="button" class="btn btn-outline btn-sm" id="btnDrawerReview" onclick="drawerMoveToReviewDiscovered()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                <span id="drawerReviewBtnText">Review</span>
              </button>
            </div>
          </div>
        </aside>
      </div>
    </div>
