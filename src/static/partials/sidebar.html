<!-- Modern Left Sidebar Navigation (Collapsed by Default) -->
    <aside class="app-sidebar collapsed" id="appSidebar">
      <!-- Brand & Identity with Collapse Button -->
      <div class="sidebar-brand">
        <div class="brand-logo" onclick="handleBrandLogoClick()" style="cursor: pointer;" title="Reach — Click to navigate or toggle sidebar">
          <span class="logo-mark" title="Reach — Job Outreach OS">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="url(#brandGrad)"/>
              <defs>
                <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#38bdf8"/>
                  <stop offset="100%" stop-color="#818cf8"/>
                </linearGradient>
              </defs>
            </svg>
          </span>
          <div class="brand-text-block">
            <span class="brand-title">Reach</span>
            <span class="brand-subtitle">Job Outreach OS</span>
          </div>
        </div>
        <button class="sidebar-collapse-btn" id="btnToggleSidebar" onclick="toggleSidebarCollapse()" title="Toggle Sidebar (Expand/Collapse)">
          <svg class="sidebar-collapse-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>

      <!-- Navigation Menu -->
      <div class="sidebar-section flex-grow">
        <div class="sidebar-section-title">Navigation</div>
        <nav class="sidebar-nav">
          <button class="nav-item active" id="btnTabAnalytics" onclick="switchTab('tabAnalytics')" title="Dashboard Overview">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
            </span>
            <span class="nav-label">Dashboard</span>
          </button>
          <button class="nav-item" id="btnTabCrawlers" onclick="switchTab('tabCrawlers')" title="Job Crawlers & Portals">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            </span>
            <span class="nav-label">Job Crawlers</span>
          </button>
          <button class="nav-item" id="btnTabDiscovered" onclick="switchTab('tabDiscovered')" title="Discovered Jobs">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <span class="nav-label">Discovered Jobs</span>
            <span class="badge-count" id="countDiscovered">0</span>
          </button>
          <button class="nav-item" id="btnTabReview" onclick="switchTab('tabReview')" title="Review & Drafts">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <span class="nav-label">Review & Drafts</span>
            <span class="badge-count" id="countReview">0</span>
          </button>
          <button class="nav-item" id="btnTabSent" onclick="switchTab('tabSent')" title="Sent & History">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </span>
            <span class="nav-label">Sent & History</span>
          </button>
        </nav>
      </div>

      <!-- Sidebar Footer: Active Resume & Controls -->
      <div class="sidebar-footer">
        <div class="resume-pill-sidebar" id="resumePill" title="Active configured resume">
          <span class="pill-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
          </span>
          <div class="resume-info">
            <span class="resume-tag">Active Resume</span>
            <span class="resume-filename" id="resumeFileName" title="Active configured resume">Loading...</span>
          </div>
          <label class="icon-btn sm" title="Upload Replacement Resume (.pdf)" for="resumeFileInput">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </label>
          <input type="file" id="resumeFileInput" accept=".pdf,.docx" style="display: none;" onchange="handleResumeUpload(this.files)" />
        </div>

        <div class="sidebar-system-bar">
          <button class="sidebar-sys-btn" id="btnQuickHeadlessToggle" onclick="toggleQuickHeadless()" title="Toggle Browser Automation Visibility (Headed vs Headless)">
            <svg class="icon-headless" id="quickHeadlessSvg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span id="quickHeadlessLabel">Headed</span>
          </button>
          <button class="sidebar-sys-btn" onclick="openSettingsModal()" title="System Settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Settings</span>
          </button>
          <button class="sidebar-sys-btn" onclick="loadDashboardData()" title="Sync & Refresh Dashboard">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            <span>Sync</span>
          </button>
        </div>
      </div>
    </aside>
